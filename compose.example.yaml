services:
  unlock:
    image: ghcr.io/cbrunie/truenas-tang-unlock@sha256:DIGEST
    restart: unless-stopped
    # Loopback reaches the TrueNAS API without crossing any network; the LAN
    # reaches tang.
    network_mode: host
    environment:
      DATASETS: tank/media tank/private
      INTERVAL: "60"
      TRUENAS_API_KEY: "1-..."
      JWE: "eyJhbGciOiJFQ0RILUVT..."
